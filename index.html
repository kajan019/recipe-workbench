<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>绵绵的工作台</title>

  <!-- ===== 图标：浏览器标签 + 手机添加到主屏幕 ===== -->
  <!-- 浏览器 favicon（传统） -->
  <link rel="icon" type="image/x-icon" href="icons/favicon.ico" />
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png" />

  <!-- iPhone / iPad 添加到主屏幕（自动圆角+高光，不需要 precomposed） -->
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <!-- iPhone Safari 状态栏样式（可选） -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="绵绵的工作台" />

  <!-- Android Chrome 添加到主屏幕 -->
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512.png" />
  <meta name="theme-color" content="#a78bfa" />
  <!-- PWA manifest（Android 用） -->
  <link rel="manifest" href="manifest.json" />

  <link rel="stylesheet" href="styles.css?v=28" />
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-avatar">🐱</div>
        <div class="brand-text">
          <div class="brand-title">绵绵的工作台</div>
          <div class="brand-sub">菜谱专区</div>
        </div>
      </div>
      <nav class="nav" id="nav">
        <button class="nav-item active" data-view="library">
          <span class="nav-ico">📖</span><span>菜谱库</span>
        </button>
        <button class="nav-item" data-view="purchase">
          <span class="nav-ico">🛒</span><span>点菜采购</span>
        </button>
        <button class="nav-item" data-view="filter">
          <span class="nav-ico">🏷️</span><span>菜谱分类筛选</span>
        </button>
        <button class="nav-item" data-view="nutrition">
          <span class="nav-ico">🔥</span><span>营养热量测算</span>
        </button>
        <button class="nav-item" data-view="favorites">
          <span class="nav-ico">📋</span><span>菜谱收藏夹</span>
        </button>
      </nav>
      <div class="sidebar-foot">
        <div class="foot-line">首期开放 · 菜谱专区</div>
        <div class="foot-line dim">营养热量 / 更多模块陆续上线</div>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="topbar-left">
          <button class="hamburger" id="hamburger" aria-label="功能菜单" title="功能菜单">☰</button>
          <div class="crumb" id="crumb">绵绵的工作台</div>
        </div>
        <div class="brand-avatar sm" title="绵绵的工作台">🐱</div>
        <button class="topbar-sync" data-action="open-sync" title="云端同步设置（GitHub）">
          <span id="syncDot" class="sync-dot"></span>☁ 同步
        </button>
        <div class="topbar-actions" id="topbarActions"></div>
      </header>
      <div class="content" id="content"></div>
    </main>

    <!-- 手机端底部Tab栏已改为左侧抽屉（见下方 .drawer），此处保留 .app 闭合 -->
  </div>

  <!-- 手机端：左侧滑出功能抽屉 + 遮罩 + 悬浮新增按钮（桌面端隐藏） -->
  <div class="drawer-mask" id="drawerMask"></div>
  <aside class="drawer" id="drawer">
    <div class="drawer-head">
      <div class="brand-avatar">🐱</div>
      <div class="drawer-title">
        <div class="brand-title">绵绵的工作台</div>
        <div class="brand-sub">个人工作台 · 菜谱专区</div>
      </div>
      <button class="drawer-close" id="drawerClose" aria-label="关闭菜单">✕</button>
    </div>
    <nav class="drawer-nav" id="drawerNav"></nav>
    <div class="drawer-foot">首期开放 · 菜谱专区<br>备忘录 / 行程 等模块陆续上线</div>
  </aside>
  <button class="fab-add" id="fabAdd" aria-label="新增菜谱" title="新增菜谱">＋</button>

  <div class="modal-root" id="modalRoot"></div>
  <div class="toast" id="toast"></div>

  <script defer src="app.js?v=28"></script>
</body>
</html>
